name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: |
          cd jeetloo_build/jeetloo-main
          flutter pub get

      - name: Build APK
        run: |
          cd jeetloo_build/jeetloo-main
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: jeetloo_build/jeetloo-main/build/app/outputs/flutter-apk/app-release.apk
