name: Build AAB
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
      - name: Install dependencies
        run: |
          cd "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main"
          flutter pub upgrade
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main/android/app/jeetloo.jks"
          ls -la "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main/android/app/jeetloo.jks"
          file "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main/android/app/jeetloo.jks"
      - name: Build AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main"
          flutter build appbundle --release
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main/build/app/outputs/bundle/release/app-release.aab"
