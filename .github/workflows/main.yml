name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Install dependencies
        run: |
          cd "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main"
          flutter pub upgrade

      - name: Build AAB
        run: |
          cd "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main"
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "jeetloo-main-paymentwall (1)/jeetloo_build/jeetloo-main/build/app/outputs/bundle/release/app-release.aab"
